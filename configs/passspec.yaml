passes:
  sroa:
    level: function
    requires_any:
      - has_alloca
    may_consume:
      - alloca
      - aggregate
      - memory_access
    may_produce:
      - scalar_value
      - simplified_load_store
      - load_store
      - scalar_cfg_opportunity:
          source: empirical_false_negative_repair
          confidence: medium
          created_in_stage: P3
          support:
            - program: testsuite_stanford_bubblesort
              pair: sroa,simplifycfg
              observed_label: not_certified_independent
            - program: testsuite_stanford_intmm
              pair: sroa,simplifycfg
              observed_label: not_certified_independent
          note: P3 static-filter repair for scalar producer to CFG simplification.
      - instcombine_opportunity
      - early_cse_opportunity
      - dce_opportunity:
          source: empirical_false_negative_repair
          confidence: medium
          created_in_stage: P8b-2
          support:
            - program: testsuite_misc_ffbench
              pair: sroa,adce
              observed_label: not_certified_independent
            - program: testsuite_misc_flops_1
              pair: sroa,dce
              observed_label: not_certified_independent
            - program: testsuite_misc_flops_1
              pair: sroa,adce
              observed_label: not_certified_independent
            - program: testsuite_misc_flops_2
              pair: sroa,dce
              observed_label: not_certified_independent
            - program: testsuite_misc_flops_2
              pair: sroa,adce
              observed_label: not_certified_independent
          note: P8b-2 repair; sroa can expose cleanup opportunities consumed by dce/adce.
    tags:
      - scalar
      - memory

  early-cse:
    level: function
    requires_any:
      - has_load_store
      - has_call
      - instruction
    may_consume:
      - repeated_expr
      - load_store
      - scalar_value
      - early_cse_opportunity
    may_produce:
      - dead_instruction
      - simplified_expr
      - scalar_cfg_opportunity:
          source: empirical_false_negative_repair
          confidence: medium
          created_in_stage: P3.5
          support:
            - program: testsuite_stanford_queens
              pair: early-cse,simplifycfg
              observed_label: not_certified_independent
          note: P3.5 hold-out repair for CSE/load simplification feeding CFG cleanup.
    tags:
      - scalar
      - memory
      - cse

  instcombine:
    level: function
    requires_any:
      - instruction
    may_consume:
      - algebraic_expr
      - canonical_expr
      - constant_operand
      - scalar_value
      - simplified_load_store
      - instcombine_opportunity
      - simplified_expr
    may_produce:
      - dead_instruction
      - simplified_expr
      - dce_opportunity
    tags:
      - scalar
      - canonicalization

  simplifycfg:
    level: function
    requires_any:
      - has_branch
    may_consume:
      - branch
      - phi
      - unreachable
      - cfg
      - scalar_cfg_opportunity:
          source: empirical_false_negative_repair
          confidence: medium
          created_in_stage: P3
          support:
            - program: testsuite_stanford_bubblesort
              pair: sroa,simplifycfg
              observed_label: not_certified_independent
            - program: testsuite_stanford_intmm
              pair: sroa,simplifycfg
              observed_label: not_certified_independent
            - program: testsuite_stanford_bubblesort
              pair: simplifycfg,gvn
              observed_label: not_certified_independent
          note: P3/P3.5 repairs for scalar producers exposing CFG simplification opportunities.
    may_produce:
      - simplified_cfg
      - instcombine_opportunity
      - dce_opportunity
    tags:
      - cfg

  reassociate:
    level: function
    requires_any:
      - instruction
    may_consume:
      - algebraic_expr
      - scalar_value
    may_produce:
      - canonical_expr
      - instcombine_opportunity
    tags:
      - scalar

  gvn:
    level: function
    requires_any:
      - instruction
    may_consume:
      - repeated_expr
      - load_store
      - scalar_value
      - simplified_expr
    may_produce:
      - dead_instruction
      - simplified_expr
      - dce_opportunity
      - scalar_cfg_opportunity:
          source: empirical_false_negative_repair
          confidence: medium
          created_in_stage: P3
          support:
            - program: testsuite_stanford_bubblesort
              pair: simplifycfg,gvn
              observed_label: not_certified_independent
          note: P3 repair for value numbering feeding simplifycfg through scalar CFG opportunity.
    tags:
      - scalar
      - memory
      - cse

  dce:
    level: function
    requires_any:
      - instruction
    may_consume:
      - dead_instruction
      - dce_opportunity
    may_produce:
      - smaller_ir
    tags:
      - cleanup

  adce:
    level: function
    requires_any:
      - instruction
    may_consume:
      - dead_instruction
      - dce_opportunity
      - control_dependence
    may_produce:
      - smaller_ir
    tags:
      - cleanup
